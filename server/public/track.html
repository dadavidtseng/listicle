<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Music Discs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/public/style.css" />
    <script defer src="/scripts/detail.js"></script>
</head>

<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong>Minecraft Music Discs</strong></li>
            </ul>
            <ul>
                <li><a href="/">Home</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <article id="track-detail">
            <div class="track-detail-layout">
                <div class="track-image-container">
                    <img id="track-image" src="" alt="" />
                </div>
                <div class="track-info">
                    <h1 id="track-name"></h1>
                    <p id="track-artist"></p>
                    <p id="track-duration"></p>
                    <p id="track-rarity"></p>
                    <p id="track-added"></p>
                    <p id="track-found"></p>
                    <p id="track-description"></p>
                </div>
            </div>
        </article>
    </main>

    <footer class="container">
        <small>Built with <a href="https://picocss.com/">PicoCSS</a></small>
    </footer>
</body>

</html>
